name: CI

# Railway auto-deploys from main and more than one person pushes to it directly,
# so until now the only thing standing between a bad commit and production was a
# human reading the diff. This is the safety net.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Session 14: before this, ts_rank ordering (tests/test_search.py) and the
    # entire pgvector path (tests/test_embeddings.py) skipped unconditionally --
    # Session 5's headline feature and 100% of Session 9's work had never once
    # been executed by CI, only read. pgvector/pgvector:pg16 is the plain
    # postgres image with the vector extension's shared library already
    # installed, so `CREATE EXTENSION vector` in database.py's schema
    # actually succeeds here (a bare `postgres:16` image would fail that
    # statement -- caught per-statement by init_db(), not fatal, but silently
    # leaves the embeddings table missing and every embeddings test failing
    # for a completely different reason than the one being tested).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sivarr
          POSTGRES_PASSWORD: sivarr_ci
          POSTGRES_DB: sivarr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Deliberately job-level, not per-step: mirrors production having
      # DATABASE_URL set for the app's entire lifetime, not just its test
      # invocation. tests/conftest.py's session-scoped fixture is what
      # actually gets the schema onto this container before tests run --
      # setting this alone is not sufficient, see that file's docstring.
      DATABASE_URL: postgresql://sivarr:sivarr_ci@localhost:5432/sivarr_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyflakes

      - name: Import check
        run: python -c "import app"

      - name: Lint for undefined names
        # Only the fatal classes (undefined name / syntax error). The codebase has
        # pre-existing unused-import and unused-variable noise that would drown a
        # full pyflakes gate; tighten this over time rather than all at once.
        run: |
          python -m pyflakes app.py core.py ai_core.py database.py routes/*.py tests/*.py \
            | grep -E "undefined name|invalid syntax" && {
              echo "::error::pyflakes found undefined names"; exit 1;
            } || echo "No undefined names."

      - name: Tests
        # -rs prints why anything skipped, straight into the CI log -- no
        # more silently trusting a green summary (this is the exact failure
        # mode Session 14 exists to close: `93 passed, 4 skipped` read as
        # "passing" with no visibility into what those 4 were). The explicit
        # zero-skip check below is the hard gate: a real DB is provisioned
        # above specifically so nothing has a reason left to skip here, and
        # if that ever regresses (a fixture breaks, a skip condition drifts)
        # this fails loudly instead of quietly reverting to "green but
        # unverified" the way it did before this session.
        run: |
          set -o pipefail
          python -m pytest tests/ -q -rs 2>&1 | tee /tmp/pytest_output.txt
          test_exit=$?
          if grep -qE '^[0-9]+ skipped' /tmp/pytest_output.txt; then
            echo "::error::Tests skipped in CI with a real Postgres provisioned -- every test should run here. See docs/SESSION_FOLLOWUPS.md Session 14."
            exit 1
          fi
          exit $test_exit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check every JS file
        run: |
          fail=0
          for f in $(find js -name '*.js' -not -path '*/vendor/*'); do
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail

      - name: Check CSS brace balance
        # A line-range deletion in CSS has cut a rule in half before, leaving an
        # orphaned closing brace that silently changed which selectors applied.
        run: |
          fail=0
          for f in css/*.css css/features/*.css; do
            open=$(tr -cd '{' < "$f" | wc -c)
            close=$(tr -cd '}' < "$f" | wc -c)
            if [ "$open" -ne "$close" ]; then
              echo "::error file=$f::unbalanced braces ($open open, $close close)"
              fail=1
            fi
          done
          exit $fail

  assets:
    name: Asset versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No hand-written cache-busters in templates
        # Version strings are derived from file content by core.py:asset().
        # A hand-written ?v= drifts out of sync and pins a stale file forever.
        run: |
          if grep -rn "?v=" templates/ --include='*.html' | grep -v "asset("; then
            echo "::error::Hand-written ?v= found. Use {{ asset('/path') }} instead."
            exit 1
          fi
          echo "No hand-written cache-busters."

  build:
    name: Asset build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build tooling
        run: npm ci

      - name: Build minified JS + CSS
        # Railway's nixpacks builder runs this same `npm run build` during
        # its own build phase (it auto-detects a package.json "build"
        # script) -- this job is what actually gates that path, since it's
        # otherwise invisible until a real deploy. build.js fails on any
        # esbuild warning, not just hard errors: a CSS comment containing a
        # literal "*/" closes early and can silently swallow the rest of a
        # file as an unterminated rule (a real bug this caught once, in
        # css/features/agents.css/marketplace.css) -- a warning here means
        # real content went missing, not a style nit.
        run: npm run build
