<div class="panel" id="panel-flux">
  <!-- Header bar -->
  <div class="fx-header">
    <div>
      <div class="fx-title"><i class="ti ti-folder-bolt"></i>Flux</div>
      <div class="fx-sub">
        <span id="sh-total-count">0</span> tasks ·
        <span id="sh-done-count">0</span> completed
      </div>
    </div>
    <div class="fx-header-actions">
      <div style="position: relative">
        <button
          class="sh-view-btn"
          id="sh-filter-btn"
          onclick="shToggleFilter(event)"
        >
          <i class="ti ti-filter"></i><span class="fx-label">Filter</span>
        </button>
        <div id="sh-filter-drop" class="sh-dropdown">
          <div class="sh-dropdown-label">Status</div>
          <label class="sh-filter-opt"
            ><input
              type="checkbox"
              value="not_started"
              onchange="shApplyFilters()"
            />
            Not started</label
          >
          <label class="sh-filter-opt"
            ><input
              type="checkbox"
              value="in_progress"
              onchange="shApplyFilters()"
            />
            In progress</label
          >
          <label class="sh-filter-opt"
            ><input type="checkbox" value="done" onchange="shApplyFilters()" />
            Done</label
          >
          <div class="sh-dropdown-label">Priority</div>
          <label class="sh-filter-opt"
            ><input
              type="checkbox"
              value="p_high"
              onchange="shApplyFilters()"
            />
            High</label
          >
          <label class="sh-filter-opt"
            ><input
              type="checkbox"
              value="p_medium"
              onchange="shApplyFilters()"
            />
            Medium</label
          >
          <label class="sh-filter-opt"
            ><input
              type="checkbox"
              value="p_normal"
              onchange="shApplyFilters()"
            />
            Normal</label
          >
          <label class="sh-filter-opt"
            ><input type="checkbox" value="p_low" onchange="shApplyFilters()" />
            Low</label
          >
          <div class="sh-dropdown-label">Due</div>
          <label class="sh-filter-opt"
            ><input
              type="checkbox"
              value="due_overdue"
              onchange="shApplyFilters()"
            />
            Overdue</label
          >
          <label class="sh-filter-opt"
            ><input
              type="checkbox"
              value="due_today"
              onchange="shApplyFilters()"
            />
            Today</label
          >
          <label class="sh-filter-opt"
            ><input
              type="checkbox"
              value="due_week"
              onchange="shApplyFilters()"
            />
            This week</label
          >
          <label class="sh-filter-opt"
            ><input
              type="checkbox"
              value="due_none"
              onchange="shApplyFilters()"
            />
            No date</label
          >
        </div>
      </div>
      <div style="position: relative">
        <button
          class="sh-view-btn"
          id="sh-sort-btn"
          onclick="shToggleSort(event)"
        >
          <i class="ti ti-arrows-sort"></i><span class="fx-label">Sort</span>
        </button>
        <div id="sh-sort-drop" class="sh-dropdown">
          <label class="sh-filter-opt"
            ><input
              type="radio"
              name="sh-sort"
              value="due_asc"
              checked
              onchange="shApplySort()"
            />
            Due date (earliest first)</label
          >
          <label class="sh-filter-opt"
            ><input
              type="radio"
              name="sh-sort"
              value="due_desc"
              onchange="shApplySort()"
            />
            Due date (latest first)</label
          >
          <label class="sh-filter-opt"
            ><input
              type="radio"
              name="sh-sort"
              value="priority"
              onchange="shApplySort()"
            />
            Priority (high to low)</label
          >
          <label class="sh-filter-opt"
            ><input
              type="radio"
              name="sh-sort"
              value="created"
              onchange="shApplySort()"
            />
            Created (newest first)</label
          >
          <label class="sh-filter-opt"
            ><input
              type="radio"
              name="sh-sort"
              value="alpha"
              onchange="shApplySort()"
            />
            Alphabetical</label
          >
        </div>
      </div>
      <button
        class="sh-view-btn active"
        id="sh-view-overview"
        onclick="setSHView('overview', this)"
      >
        <i class="ti ti-table"></i><span class="fx-label">Overview</span>
      </button>
      <button
        class="sh-view-btn"
        id="sh-view-board"
        onclick="setSHView('board', this)"
      >
        <i class="ti ti-columns"></i><span class="fx-label">Board</span>
      </button>
      <button
        class="sh-view-btn"
        id="sh-view-list"
        onclick="setSHView('list', this)"
      >
        <i class="ti ti-list-details"></i><span class="fx-label">List</span>
      </button>
      <button class="sh-add-task-btn" onclick="openAddTask()">
        <i class="ti ti-plus"></i><span class="fx-label">New Task</span>
      </button>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="fx-progress-wrap">
    <div class="fx-progress-track">
      <div id="sh-progress-bar"></div>
    </div>
    <span id="sh-pct">0%</span>
  </div>

  <!-- Overview view — table -->
  <div id="sh-overview-view">
    <table id="sh-overview-table">
      <colgroup>
        <col style="width: 32px" />
        <!-- Bulk checkbox -->
        <col style="width: 220px" />
        <!-- Task name -->
        <col style="width: 110px" />
        <!-- Status -->
        <col style="width: 100px" />
        <!-- Task type -->
        <col style="width: 160px" />
        <!-- Description -->
        <col style="width: 110px" />
        <!-- Assignee -->
        <col style="width: 110px" />
        <!-- Due date -->
        <col style="width: 95px" />
        <!-- Priority -->
        <col style="width: 90px" />
        <!-- Attach file -->
        <col style="width: 110px" />
        <!-- Last Updated -->
        <col style="width: 160px" />
        <!-- Summary -->
        <col style="width: 70px" />
        <!-- Done -->
      </colgroup>
      <thead>
        <tr>
          <th class="sh-th" style="text-align: center">
            <input
              type="checkbox"
              id="sh-bulk-all"
              onchange="_shBulkSelectAll(this.checked)"
            />
          </th>
          <th class="sh-th">Task name</th>
          <th class="sh-th">Status</th>
          <th class="sh-th">Task type</th>
          <th class="sh-th">Description</th>
          <th class="sh-th">Assignee</th>
          <th class="sh-th">Due date</th>
          <th class="sh-th">Priority</th>
          <th class="sh-th">Attach</th>
          <th class="sh-th">Last Updated</th>
          <th class="sh-th">Summary</th>
          <th class="sh-th" style="text-align: center">
            <i class="ti ti-check"></i>
          </th>
        </tr>
      </thead>
      <tbody id="sh-overview-rows"></tbody>
      <tfoot>
        <tr>
          <td colspan="12">
            <button onclick="openAddTask()">
              <i class="ti ti-plus" style="margin-right: 6px"></i>New task
            </button>
          </td>
        </tr>
      </tfoot>
    </table>

    <!-- Bulk action bar -->
    <div id="sh-bulk-bar">
      <span id="sh-bulk-count"></span>
      <button class="fx-bulk-btn complete" onclick="_shBulkComplete()">
        <i class="ti ti-check"></i> Complete
      </button>
      <select class="fx-bulk-select" onchange="_shBulkPriority(this.value)">
        <option value="">Priority…</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
        <option value="normal">Normal</option>
      </select>
      <button class="fx-bulk-btn delete" onclick="_shBulkDelete()">
        <i class="ti ti-trash"></i> Delete
      </button>
      <div style="flex: 1"></div>
      <button class="fx-bulk-clear" onclick="_shBulkClear()">
        <i class="ti ti-x"></i> Clear
      </button>
    </div>
  </div>

  <!-- Board view -->
  <div id="sh-board-view">
    <!-- Column: Not Started -->
    <div class="sh-col">
      <div class="sh-col-header">
        <div class="sh-col-dot" style="background: var(--fx-t3)"></div>
        <span class="sh-col-title">Not Started</span>
        <span class="sh-col-count" id="sh-col-count-todo">0</span>
      </div>
      <div
        class="sh-col-body"
        id="sh-col-todo"
        ondragover="shDragOver(event)"
        ondrop="shDrop(event, 'todo')"
      ></div>
      <button class="sh-col-add" onclick="openAddTask('todo')">
        <i class="ti ti-plus"></i> Add task
      </button>
    </div>

    <!-- Column: In Progress -->
    <div class="sh-col">
      <div class="sh-col-header">
        <div class="sh-col-dot" style="background: var(--fx-blue)"></div>
        <span class="sh-col-title">In Progress</span>
        <span class="sh-col-count" id="sh-col-count-inprogress">0</span>
      </div>
      <div
        class="sh-col-body"
        id="sh-col-inprogress"
        ondragover="shDragOver(event)"
        ondrop="shDrop(event, 'inprogress')"
      ></div>
      <button class="sh-col-add" onclick="openAddTask('inprogress')">
        <i class="ti ti-plus"></i> Add task
      </button>
    </div>

    <!-- Column: Done -->
    <div class="sh-col">
      <div class="sh-col-header">
        <div class="sh-col-dot" style="background: var(--fx-green)"></div>
        <span class="sh-col-title">Done</span>
        <span class="sh-col-count" id="sh-col-count-done">0</span>
      </div>
      <div
        class="sh-col-body"
        id="sh-col-done"
        ondragover="shDragOver(event)"
        ondrop="shDrop(event, 'done')"
      ></div>
      <button class="sh-col-add" onclick="openAddTask('done')">
        <i class="ti ti-plus"></i> Add task
      </button>
    </div>

    <!-- Column: AI Tools -->
    <div class="sh-col" style="min-width: 220px">
      <div class="sh-col-header">
        <div class="sh-col-dot" style="background: var(--fx-accent)"></div>
        <span class="sh-col-title">AI Tools</span>
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 10px;
          padding: 4px 0;
          overflow-y: auto;
          max-height: calc(100vh - 260px);
        "
      >
        <div class="sh-ai-card">
          <div class="sh-ai-title">
            <i class="ti ti-brain"></i> Break Down a Task
          </div>
          <textarea
            id="sh-structure-input"
            class="sh-input"
            rows="2"
            placeholder="Describe your task..."
            style="resize: none; margin-bottom: 8px"
          ></textarea>
          <button
            class="sh-add-btn"
            style="width: 100%"
            onclick="generateTaskStructure()"
          >
            Generate Steps
          </button>
          <div
            id="sh-structure-result"
            style="
              display: none;
              margin-top: 8px;
              font-size: 0.75rem;
              line-height: 1.6;
              color: var(--fx-t2);
            "
            class="lab-content"
          ></div>
        </div>
        <div class="sh-ai-card">
          <div class="sh-ai-title">
            <i class="ti ti-file-text"></i> Create PDF
          </div>
          <input
            id="sh-pdf-title"
            class="sh-input"
            placeholder="PDF title..."
            style="margin-bottom: 6px"
          />
          <textarea
            id="sh-pdf-content"
            class="sh-input"
            rows="3"
            placeholder="Paste content here..."
            style="resize: none; margin-bottom: 8px"
          ></textarea>
          <button
            class="sh-add-btn"
            style="width: 100%"
            onclick="createStudyPDF()"
          >
            Download PDF
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- List view -->
  <div id="sh-list-view">
    <div id="sh-list-container"></div>
  </div>

  <!-- Add / Edit task modal -->
  <div id="sh-modal-bg">
    <div class="fx-modal-card">
      <div class="fx-sheet-handle"></div>
      <div class="fx-modal-heading">
        <span id="sh-modal-heading">New Task</span>
        <button class="fx-modal-close" onclick="closeSHModal()">
          <i class="ti ti-x"></i>
        </button>
      </div>

      <!-- Task name -->
      <div class="sh-field-group">
        <label class="sh-field-label">Task name *</label>
        <input
          id="sh-modal-title"
          class="sh-input"
          placeholder="e.g. Write introduction chapter"
          style="font-size: 0.9rem"
          onkeydown="
            if (event.key === 'Enter' && !event.shiftKey) saveSHModal();
          "
        />
      </div>

      <!-- Status + Task type -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
        <div class="sh-field-group">
          <label class="sh-field-label">Status</label>
          <select
            id="sh-modal-status"
            class="sh-input"
            style="font-size: 0.82rem"
          >
            <option value="todo">Not Started</option>
            <option value="inprogress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="sh-field-group">
          <label class="sh-field-label">Task type</label>
          <select
            id="sh-modal-type"
            class="sh-input"
            style="font-size: 0.82rem"
          >
            <option value="work">📋 Work Item</option>
            <option value="research">🔬 Research</option>
            <option value="reading">📖 Reading</option>
            <option value="project">🗂 Project</option>
            <option value="review">🔄 Review</option>
            <option value="other">⚙️ Other</option>
          </select>
        </div>
      </div>

      <!-- Description -->
      <div class="sh-field-group">
        <label class="sh-field-label">Description</label>
        <textarea
          id="sh-modal-desc"
          class="sh-input"
          rows="2"
          placeholder="What needs to be done..."
          style="resize: none; font-size: 0.84rem"
        ></textarea>
      </div>

      <!-- Assignee + Priority -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
        <div class="sh-field-group">
          <label class="sh-field-label">Assignee</label>
          <input
            id="sh-modal-assignee"
            class="sh-input"
            placeholder="Name or @username"
            style="font-size: 0.82rem"
          />
        </div>
        <div class="sh-field-group">
          <label class="sh-field-label">Priority</label>
          <select
            id="sh-modal-priority"
            class="sh-input"
            style="font-size: 0.82rem"
          >
            <option value="normal">Normal</option>
            <option value="high">🔴 High</option>
            <option value="medium">🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
      </div>

      <!-- Link to goal -->
      <div class="sh-field-group">
        <label class="sh-field-label"
          >Link to goal
          <span style="color: var(--fx-t4); font-weight: 400"
            >(optional)</span
          ></label
        >
        <select id="sh-modal-goal" class="sh-input" style="font-size: 0.82rem">
          <option value="">No goal</option>
        </select>
      </div>

      <!-- Due date + Time -->
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px">
        <div class="sh-field-group">
          <label class="sh-field-label">Due date</label>
          <input
            id="sh-modal-date"
            type="date"
            class="sh-input"
            style="font-size: 0.82rem"
          />
        </div>
        <div class="sh-field-group">
          <label class="sh-field-label">Due time</label>
          <input
            id="sh-modal-time"
            type="time"
            class="sh-input"
            style="font-size: 0.82rem"
          />
        </div>
        <div class="sh-field-group">
          <label class="sh-field-label">Repeat</label>
          <select
            id="sh-modal-recur"
            class="sh-input"
            style="font-size: 0.82rem"
          >
            <option value="">One time</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
      </div>

      <!-- Summary -->
      <div class="sh-field-group">
        <label class="sh-field-label">Summary / Notes</label>
        <textarea
          id="sh-modal-summary"
          class="sh-input"
          rows="2"
          placeholder="Brief summary or additional notes..."
          style="resize: none; font-size: 0.84rem"
        ></textarea>
      </div>

      <!-- Attach file -->
      <div class="sh-field-group">
        <label class="sh-field-label">Attach file</label>
        <div style="display: flex; gap: 8px; align-items: center">
          <input
            type="file"
            id="sh-modal-file"
            style="display: none"
            onchange="handleSHAttach(this)"
          />
          <button class="fx-attach-btn" onclick="$('sh-modal-file').click()">
            <i class="ti ti-paperclip"></i> Choose file
          </button>
          <span
            id="sh-modal-file-name"
            style="font-size: 0.75rem; color: var(--fx-t3)"
            >No file chosen</span
          >
        </div>
      </div>

      <!-- Actions -->
      <div style="display: flex; gap: 8px; margin-top: 0.5rem">
        <button class="fx-btn-primary" onclick="saveSHModal()">
          Save Task
        </button>
        <button class="fx-btn-ghost" onclick="closeSHModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Task detail side panel -->
  <div id="sh-detail-panel">
    <div class="fx-detail-head">
      <span>Task Detail</span>
      <button class="fx-detail-close" onclick="shCloseDetail()">
        <i class="ti ti-x"></i>
      </button>
    </div>
    <div id="sh-detail-body"></div>
  </div>
  <div id="sh-detail-backdrop" onclick="shCloseDetail()"></div>
</div>
