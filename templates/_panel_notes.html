{# ── NOTES / DOCS ── #}
<div class="panel" id="panel-notes">
  <!-- Doc sidebar -->
  <div class="doc-sidebar">
    <div class="doc-sb-top">
      <button class="doc-new-btn" data-onclick="docNew">
        <i class="ti ti-plus"></i> New Doc
      </button>
      <div class="doc-search-wrap">
        <i class="ti ti-search doc-search-icon"></i>
        <input
          class="doc-search-input"
          id="doc-search"
          placeholder="Search docs..."
          data-oninput="docSearchFilter"
        />
      </div>
    </div>
    <div class="doc-list" id="doc-list">
      <div class="doc-list-empty">No docs yet</div>
    </div>
  </div>

  <!-- Editor area -->
  <div class="doc-editor-area">
    <!-- Empty state -->
    <div class="doc-empty-state" id="doc-empty-state">
      <div class="doc-es-icon">📄</div>
      <div class="doc-es-title">No document open</div>
      <div class="doc-es-sub">Select a doc or create a new one</div>
      <button class="doc-es-btn" data-onclick="docNew">
        + Create your first doc
      </button>
    </div>

    <!-- Editor (shown when a doc is open) -->
    <div class="doc-editor-wrap" id="doc-editor-wrap" style="display: none">
      <!-- Toolbar -->
      <div class="doc-toolbar" id="doc-toolbar">
        <div class="doc-tb-group">
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormat" data-onmousedown-arg1="bold"
            title="Bold"
          >
            <i class="ti ti-bold"></i>
          </button>
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormat" data-onmousedown-arg1="italic"
            title="Italic"
          >
            <i class="ti ti-italic"></i>
          </button>
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormat" data-onmousedown-arg1="underline"
            title="Underline"
          >
            <i class="ti ti-underline"></i>
          </button>
        </div>
        <div class="doc-tb-sep"></div>
        <div class="doc-tb-group">
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormatBlock" data-onmousedown-arg1="h1"
            title="Heading 1"
          >
            <b style="font-size: 0.8rem">H1</b>
          </button>
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormatBlock" data-onmousedown-arg1="h2"
            title="Heading 2"
          >
            <b style="font-size: 0.78rem">H2</b>
          </button>
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormatBlock" data-onmousedown-arg1="h3"
            title="Heading 3"
          >
            <b style="font-size: 0.74rem">H3</b>
          </button>
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormatBlock" data-onmousedown-arg1="p"
            title="Paragraph"
          >
            <i class="ti ti-pilcrow"></i>
          </button>
        </div>
        <div class="doc-tb-sep"></div>
        <div class="doc-tb-group">
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormat" data-onmousedown-arg1="insertUnorderedList"
            title="Bullet list"
          >
            <i class="ti ti-list"></i>
          </button>
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormat" data-onmousedown-arg1="insertOrderedList"
            title="Numbered list"
          >
            <i class="ti ti-list-numbers"></i>
          </button>
        </div>
        <div class="doc-tb-sep"></div>
        <div class="doc-tb-group">
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormatBlock" data-onmousedown-arg1="blockquote"
            title="Quote"
          >
            <i class="ti ti-quote"></i>
          </button>
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docFormatBlock" data-onmousedown-arg1="pre"
            title="Code block"
          >
            <i class="ti ti-code"></i>
          </button>
        </div>
        <div class="doc-tb-sep"></div>
        <div class="doc-tb-group">
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docExportMd"
            title="Export as Markdown"
          >
            <i class="ti ti-markdown"></i>
          </button>
          <button
            class="doc-tb-btn"
            data-onmousedown="_mdPreventThenCall" data-onmousedown-event data-onmousedown-arg0="docExportPdf"
            title="Export as PDF"
          >
            <i class="ti ti-file-type-pdf"></i>
          </button>
        </div>
        <div class="doc-tb-sep"></div>
        <div class="doc-tb-group">
          <button
            class="doc-tb-btn"
            id="doc-publish-btn"
            data-onclick="docTogglePublic"
            title="Publish a read-only link"
          >
            <i class="ti ti-world"></i>
          </button>
        </div>
        <div class="doc-tb-sep"></div>
        <button class="doc-siva-btn" data-onclick="docInlineAI">
          <i class="ti ti-sparkles"></i> AI Write
        </button>
      </div>

      <!-- Publish panel (hidden until this doc is published) -->
      <div
        id="doc-publish-panel"
        style="
          display: none;
          border-bottom: 1px solid var(--border);
          padding: 10px 16px;
          background: var(--surface);
          flex-shrink: 0;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        "
      >
        <i class="ti ti-world" style="color: var(--accent)"></i>
        <span style="font-size: 0.8rem; color: var(--muted)"
          >Anyone with this link can view a read-only copy:</span
        >
        <input
          id="doc-publish-link"
          readonly
          style="
            flex: 1;
            min-width: 200px;
            font-size: 0.8rem;
            padding: 6px 9px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--bg);
            color: var(--text);
          "
        />
        <button
          class="doc-tb-btn"
          data-onclick="docCopyPublicLink"
          title="Copy link"
        >
          <i class="ti ti-copy"></i>
        </button>
      </div>

      <!-- Inline AI panel (hidden until triggered) -->
      <div
        id="doc-ai-panel"
        style="
          display: none;
          border-bottom: 1px solid var(--border);
          padding: 12px 16px;
          background: var(--surface);
          flex-shrink: 0;
        "
      >
        <div style="display: flex; gap: 8px; align-items: flex-start">
          <div style="flex: 1; min-width: 0">
            <input
              id="doc-ai-prompt"
              class="doc-ai-prompt-input"
              placeholder="What should Sivarr write or improve? (e.g. 'Expand this', 'Make it formal')"
              data-onkeydown="_onEnterCallNamed" data-onkeydown-event data-onkeydown-arg0="docAIGenerate"
            />
            <div
              id="doc-ai-result"
              style="
                display: none;
                margin-top: 8px;
                padding: 10px 12px;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 8px;
                font-size: 0.83rem;
                color: var(--text);
                line-height: 1.65;
                max-height: 180px;
                overflow-y: auto;
                white-space: pre-wrap;
              "
            ></div>
          </div>
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 5px;
              flex-shrink: 0;
            "
          >
            <button
              data-onclick="docAIGenerate"
              style="
                background: var(--accent);
                color: #fff;
                border: none;
                border-radius: 7px;
                padding: 7px 13px;
                font-family: var(--font-body);
                font-size: 0.78rem;
                font-weight: 600;
                cursor: pointer;
                white-space: nowrap;
              "
            >
              ✨ Generate
            </button>
            <button
              id="doc-ai-insert"
              data-onclick="docAIInsert"
              style="
                display: none;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 7px;
                padding: 6px 11px;
                font-family: var(--font-body);
                font-size: 0.76rem;
                cursor: pointer;
                color: var(--text2);
                white-space: nowrap;
              "
            >
              Insert ↓
            </button>
            <button
              id="doc-ai-replace"
              data-onclick="docAIReplace"
              style="
                display: none;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 7px;
                padding: 6px 11px;
                font-family: var(--font-body);
                font-size: 0.76rem;
                cursor: pointer;
                color: var(--text2);
                white-space: nowrap;
              "
            >
              Replace ↺
            </button>
            <button
              data-onclick="docAIPanelClose"
              style="
                background: none;
                border: 1px solid var(--border);
                border-radius: 7px;
                padding: 6px 9px;
                font-size: 0.76rem;
                cursor: pointer;
                color: var(--muted);
              "
            >
              ✕
            </button>
          </div>
        </div>
      </div>

      <!-- Title -->
      <div class="doc-title-area">
        <input
          class="doc-title-input"
          id="doc-title"
          placeholder="Untitled"
          data-oninput="docTitleChange"
        />
      </div>

      <!-- Content — Tiptap mounts here -->
      <div class="doc-content" id="doc-content"></div>

      <!-- Footer -->
      <div class="doc-footer">
        <span class="doc-save-status" id="doc-save-status"
          >All changes saved</span
        >
        <div style="display: flex; gap: 14px">
          <span class="doc-word-count" id="doc-word-count">0 words</span>
          <span
            class="doc-word-count"
            id="doc-read-time"
            style="color: var(--muted)"
            >0 min read</span
          >
        </div>
      </div>
    </div>
  </div>
</div>
