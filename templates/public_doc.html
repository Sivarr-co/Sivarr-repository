<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>{{ title }}: Sivarr</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple: #41076B;
  --purple2:#7B2CAD;
  --bg:     #080808;
  --card:   #111111;
  --border: #1e1e1e;
  --text1:  #f0f0f0;
  --text2:  #a0a0a0;
  --muted:  #555;
  --font:   'Plus Jakarta Sans', system-ui, sans-serif;
}

body {
  background: var(--bg); color: var(--text1); font-family: var(--font);
  font-size: 16px; line-height: 1.7; min-height: 100vh;
  display: flex; flex-direction: column;
}

header {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
header .mark {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--purple), var(--purple2));
}
header .name { font-weight: 800; font-size: 0.95rem; }
header .tag {
  font-size: 0.72rem; color: var(--muted); margin-left: 6px;
  padding: 2px 8px; border: 1px solid var(--border); border-radius: 20px;
}

main { flex: 1; max-width: 720px; width: 100%; margin: 0 auto; padding: 48px 24px 80px; }
h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 24px; word-break: break-word; }
.doc-body {
  white-space: pre-wrap; word-break: break-word;
  font-size: 1rem; color: var(--text2);
}

footer {
  text-align: center; padding: 24px; border-top: 1px solid var(--border);
  font-size: 0.82rem; color: var(--muted);
}
footer a { color: var(--purple2); text-decoration: none; }
footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <div class="mark"></div>
    <span class="name">Sivarr</span>
    <span class="tag">Read-only</span>
  </header>
  <main>
    <h1>{{ title }}</h1>
    <div class="doc-body">{{ content }}</div>
  </main>
  <footer>
    Shared read-only from <a href="/">Sivarr</a> — your productivity OS.
  </footer>
</body>
</html>
